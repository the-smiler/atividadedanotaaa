<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de notas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topo">
      <h2 class="marca-occ">OCC</h2>
    </header>

    <main class="container">
      <section class="card">
        <h1>Sistema   de notas</h1>

        <form id="form-notas" novalidate>
          <div class="campo">
            <label for="nomeAluno">Nome do aluno</label>
            <input
              type="text"
              id="nomeAluno"
              name="nomeAluno"
              placeholder="Ex: Ana"
              autocomplete="off"
            />
          </div>

          <div class="campo-group">
            <div class="campo">
              <label for="nota1">Trimestre 1</label>
              <input type="number" id="nota1" name="nota1" min="0" max="10" step="0.1" placeholder="0 a 10" />
            </div>

            <div class="campo">
              <label for="nota2">Trimestre 2</label>
              <input type="number" id="nota2" name="nota2" min="0" max="10" step="0.1" placeholder="0 a 10" />
            </div>

            <div class="campo">
              <label for="nota3">Trimestre 3</label>
              <input type="number" id="nota3" name="nota3" min="0" max="10" step="0.1" placeholder="0 a 10" />
            </div>
          </div>

          <div class="botoes">
            <button type="submit" class="btn btn-primary">Calcular media</button>
            <button type="button" id="btnLimpar" class="btn btn-secondary">Limpeza</button>
          </div>
        </form>

        <section id="resultado" class="resultado" aria-live="polite">
          Coloque as nota para visualizar o resultado
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
